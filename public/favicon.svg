<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a1610"/>
      <stop offset="100%" stop-color="#0f0907"/>
    </radialGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b041"/>
      <stop offset="100%" stop-color="#b96518"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Pizzeria Badge -->
  <rect width="100" height="100" rx="22" fill="url(#bg)" stroke="#e0a96d" stroke-width="4"/>
  <!-- Golden Crust Arc (Top-Left to Top-Right) -->
  <path d="M 18 28 Q 50 8 82 28 L 50 86 Z" fill="url(#crust)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tomato Sauce Rim -->
  <path d="M 23 32 Q 50 15 77 32 L 50 82 Z" fill="#b91c1c"/>
  <!-- Melted Mozzarella Triangle -->
  <path d="M 26 35 Q 50 20 74 35 L 50 80 Z" fill="url(#cheese)"/>
  <!-- Pepperoni Slices -->
  <circle cx="43" cy="43" r="7.5" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <circle cx="59" cy="46" r="7" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <circle cx="50" cy="61" r="6.5" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- Pepperoni Highlights -->
  <circle cx="41" cy="41" r="1.3" fill="#fca5a5"/>
  <circle cx="57" cy="44" r="1.3" fill="#fca5a5"/>
  <circle cx="48" cy="59" r="1.3" fill="#fca5a5"/>
  <!-- Fresh Basil Leaf -->
  <ellipse cx="51" cy="36" rx="5.5" ry="3" transform="rotate(-22 51 36)" fill="#16a34a" stroke="#14532d" stroke-width="1"/>
</svg>
